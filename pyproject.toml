[project]
name = "DownscaledClimateData"
version = "1.0.0"
description = "Dagster project for downscaled climate data"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "dagster",
    "dagster-cloud",
    "dagster-postgres",
    "boto3>=1.34.131",
    "dagster-aws",
    "s3fs>=2024.2.0",
    "gcsfs>=2024.2.0",
    "intake-esm==2024.2.6",
    "xarray[complete]>=2024.2.0",
    # Pin to Zarr 2 til more examples come up on how to use Zarr 3 with S3
    "zarr<3",
    "beautifulsoup4>=4.12.0",
    "geopandas>=0.14.0"
]

[project.optional-dependencies]
dev = [
    "dagster-webserver", 
]

test = [
    "pytest",
    "pytest-mock",
    "python-dotenv"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.dagster]
module_name = "downscaled_climate_data.definitions"
project_name = "DownscaledClimateData"

[tool.setuptools.packages.find]
exclude=["dagster_tests"]
